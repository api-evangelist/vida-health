  - 22068b30-c888-4c49-9a84-e073ab34f9ff
  - 1b6c92b8-a769-48ba-a793-2fa3c79a881c
  note: >-
    Emitted on every response including unauthenticated 401s, and unique per
    request. This is the one genuine agent-usable runtime convention Vida exposes
    anonymously — a correlation id a caller can quote to support. It is not
    documented anywhere on vida.com.
error_envelope:
