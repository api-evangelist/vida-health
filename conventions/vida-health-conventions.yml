name: Vida Health API conventions
description: >-
  Cross-cutting runtime semantics for api.vida.com. Vida operates no developer
  program: there is no reference, no OpenAPI and no docs host, so this profile is
  built ENTIRELY from what the live host emits on an unauthenticated request. Only
  the error path is observable — every path returns HTTP 401 — so the successful
  request/response conventions (pagination, expansion, idempotency, versioning
  negotiation) are NOT knowable from outside and are recorded as unknown rather
  than guessed.
host: https://api.vida.com
observability: error-path-only
authentication:
  style: bearer-token (inferred)
  evidence: >-
    Every path returns 401 with body {"error": "Invalid or expired access token"}.
    The phrase "access token" is the only public signal of the scheme.
  www_authenticate_header: absent
  note: >-
    No WWW-Authenticate challenge is returned, so an agent receiving the 401 is
    given no machine-readable hint about which scheme or authorization server to
    use. /.well-known/oauth-authorization-server and
    /.well-known/oauth-protected-resource are themselves 401-gated, so RFC 9728
    resource-metadata discovery is unavailable.
  documented: false
request_id:
  supported: true
  header: x-request-id
  direction: response
  format: UUIDv4
  observed:
