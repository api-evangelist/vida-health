aid: vida-health
name: Vida Health
description: 'Vida Health is a San Francisco-based virtual care company founded in
  2014 that combines an AI-powered mobile app with a national network of licensed clinicians,
  coaches and therapists to prevent, manage and reverse chronic cardiometabolic and
  behavioral health conditions including obesity, diabetes, hypertension, depression
  and anxiety. Vida sells a turnkey enterprise programme to employers and health plans,
  layering GLP-1 prescribing and clinical oversight on top of behavioral coaching,
  and its platform ingests real-time readings from more than 100 connected devices
  and consumer health apps to feed outcome reporting back to its enterprise buyers.
  Vida publishes no public developer portal or API documentation: the API host api.vida.com
  is live but returns 401 on every path, and data/EHR integration for health plans
  and employers is arranged through enterprise sales rather than self-service onboarding.'
