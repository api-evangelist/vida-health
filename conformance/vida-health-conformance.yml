- id: fhir
  name: HL7 FHIR
  conforms: false
  evidence: >-
    No FHIR capability statement, no /metadata endpoint, no FHIR base URL and no
    mention of FHIR anywhere on vida.com or in the HIE consent notice.
- id: oauth2-oidc
  name: OAuth 2.0 / OpenID Connect discovery
  conforms: unknown
  evidence: >-
    /.well-known/openid-configuration and /.well-known/oauth-authorization-server
    return 401 on api.vida.com and 404 on www.vida.com. api.vida.com's 401 body
    ("Invalid or expired access token") implies a bearer-token scheme, but the
    scheme is not documented and discovery is gated, so conformance cannot be
    established.
- id: rfc9457
  name: RFC 9457 Problem Details for HTTP APIs
  conforms: false
  evidence: >-
    api.vida.com returns a bare {"error": "..."} JSON body with
    content-type application/json, not application/problem+json.
